# QuaVer strategy spec template. Every value below is made up.
#
# Every value carries a `source` saying where it came from:
#   stated   - the paper says it. Give `page` (>= 1) and `quote` (at most 25 words, verbatim).
#   inferred - the paper implies it. Give `page` and `reason` (how you got from the page to the value).
#   assumed  - the paper does not say. Give `reason` only; `page` must be left out.
#   table    - a value read off a table or chart image, which cannot be quoted. Give `page`,
#              `section` (the exhibit name) and `locator` (row and column); `quote` must be null.
#              `reason` is optional, for notes on the reading. check-quotes skips these, so get a
#              second, independent reading and compare the two with `quaver compare-readings`.
# `section` is optional on any source except table. Page numbers refer to the PDF identified by pdf_sha256.
# Quote strings that could be read as numbers or dates (hashes, YYYY-MM) so YAML keeps them as text.

paper:
  # Full title exactly as printed on the paper.
  title: "Example Paper"
  # One entry per author, as printed.
  authors: ["A. Author", "B. Writer"]
  # Year of publication.
  year: 2000
  # Where the paper was obtained (stable link, not a search result).
  url: "https://example.com/example-paper.pdf"
  # The draft date printed on the paper, so a later revision is not mistaken for this one.
  version: "January 2000"
  # SHA-256 of the exact PDF the page numbers refer to: 64 lowercase hex characters.
  # Compute with: shasum -a 256 papers/<file>.pdf
  pdf_sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# How this spec was extracted, by whom, and whether a human has checked it against the paper.
extraction:
  # "hand" or "ai-drafted, human-verified".
  method: "hand"
  # Who (or which tool and model) wrote the first draft.
  drafted_by: "C. Extractor"
  # Who checked every field against the PDF. null until that is done; validate-spec then says "unverified".
  verified_by: "D. Checker"
  # Date of the extraction, YYYY-MM-DD.
  date: "2000-02-01"

# The set of securities the strategy chooses from. Cite the page that defines it.
universe:
  value: "All common stocks listed on the Example Exchange"
  source:
    kind: stated
    page: 3
    section: "Data"
    quote: "We use all common stocks listed on the Example Exchange."

# Where the paper's price/return data comes from (vendor or database name).
data_source:
  value: "Example Price Database"
  source:
    kind: stated
    page: 3
    quote: "Returns are taken from the Example Price Database."

# How often the strategy is observed and traded: monthly, daily, ...
frequency:
  value: "monthly"
  source:
    kind: inferred
    page: 4
    reason: "All tables report monthly returns, so portfolios are formed monthly."

# The ranking variable used to pick securities, in words precise enough to code.
signal:
  value: "Cumulative return over the lookback window, skipping the most recent month"
  source:
    kind: stated
    page: 4
    quote: "Stocks are ranked on their cumulative return over the formation period."

# How portfolio weights are set: equal weight, value weight, ...
weighting:
  value: "equal weight"
  source:
    kind: stated
    page: 5
    quote: "Each portfolio is equally weighted."

# When and how the portfolio is rebuilt: monthly, quarterly, overlapping holdings, ...
rebalance:
  value: "monthly"
  source:
    kind: inferred
    page: 5
    reason: "A new portfolio is formed each month and held for one month."

# Transaction costs applied to reported results. If the paper is silent, assume and say so.
costs:
  value: "none"
  source:
    kind: assumed
    reason: "The paper reports gross returns and never mentions trading costs."

# The comparison portfolio or index the paper measures against.
benchmark:
  value: "Equal-weighted market portfolio"
  source:
    kind: stated
    page: 6
    quote: "We compare each strategy with the equal-weighted market portfolio."

# First and last month of the paper's sample, as YYYY-MM. Start must be before end.
sample_start:
  value: "1960-01"
  source:
    kind: stated
    page: 3
    quote: "Our sample begins in January 1960."

sample_end:
  value: "1990-12"
  source:
    kind: stated
    page: 3
    quote: "and ends in December 1990."

# Lookback windows in months: positive, unique, sorted ascending.
lookbacks_months:
  value: [6, 12]
  source:
    kind: stated
    page: 4
    quote: "We consider formation periods of 6 and 12 months."

# Number of securities held in the top portfolio: positive, unique, sorted ascending.
top_n:
  value: [10, 20]
  source:
    kind: assumed
    reason: "The paper uses deciles; with this made-up universe a decile is about 10 to 20 names."

# Months between the end of the signal window and the trade (0 = trade at once).
signal_lag_months:
  value: 1
  source:
    kind: stated
    page: 4
    quote: "We skip one month between the formation period and the holding period."

# What each metric used by a claim means, in the paper's terms. Every claim's `metric` must be a
# key here. Each definition is cited like any other value; if the paper never defines the
# metric, say so with an `assumed` or `inferred` source rather than leaving it out.
metrics:
  mean_monthly_return:
    value: "Arithmetic mean of the portfolio's monthly returns over the period"
    source:
      kind: inferred
      page: 7
      section: "Table 1"
      reason: "Table 1 reports one figure per month for each portfolio; the paper does not define it, so the arithmetic mean is the natural reading."
  annualised_volatility:
    value: "Standard deviation of monthly returns, multiplied by the square root of 12"
    source:
      kind: assumed
      reason: "The paper prints a volatility figure without saying how it is computed; this is the usual convention."

# Headline numbers the replication will be checked against. Ids are C1, C2, ...
# A claim is about the strategy or about the benchmark (`subject`). Strategy claims give
# lookback_months and top_n, which must appear in the lists above; benchmark claims set both to null.
# The period must lie inside the sample.
claims:
  - id: "C1"
    # "strategy" or "benchmark".
    subject: "strategy"
    # The claim in the paper's own terms.
    statement: "The 12-month top-10 portfolio earns 1.1 percent per month."
    # What is measured: mean_monthly_return, sharpe_ratio, ...
    metric: "mean_monthly_return"
    lookback_months: 12
    top_n: 10
    # Period the number covers, YYYY-MM.
    period_start: "1960-01"
    period_end: "1990-12"
    # The number as printed, and its unit (percent_per_month, ratio, ...).
    value: 1.1
    unit: "percent_per_month"
    # Where the number appears: the table or sentence on a page.
    source:
      kind: stated
      page: 7
      section: "Table 1"
      quote: "Top-decile portfolio, 12-month formation: 1.10 percent per month."
  - id: "C2"
    subject: "benchmark"
    statement: "The equal-weighted market portfolio earns 0.9 percent per month."
    metric: "mean_monthly_return"
    lookback_months: null
    top_n: null
    period_start: "1960-01"
    period_end: "1990-12"
    value: 0.9
    unit: "percent_per_month"
    source:
      kind: stated
      page: 7
      section: "Table 1"
      quote: "The equal-weighted market portfolio earns 0.90 percent per month."
  - id: "C3"
    subject: "strategy"
    statement: "The 12-month top-10 portfolio has annual volatility of 4.2 percent."
    metric: "annualised_volatility"
    lookback_months: 12
    top_n: 10
    period_start: "1960-01"
    period_end: "1990-12"
    value: 4.2
    unit: "percent_per_year"
    # A table value: the table is an image with no text layer, so there is no quote. The locator
    # names the row and column to look at.
    source:
      kind: table
      page: 7
      section: "Table 1"
      locator: "row Top-decile 12-month, column Volatility"
