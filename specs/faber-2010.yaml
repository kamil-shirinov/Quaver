# Quaver strategy spec for Faber (2010). AI-drafted, human-verified.
#
# Page numbers mean PDF page numbers counted from 1, matching the "=== page N ===" markers
# in papers/faber-2010.txt, NOT the numbers printed on the pages.
#
# Every value carries a `source` saying where it came from:
#   stated   - the paper says it. Give `page` (>= 1) and `quote` (at most 25 words, verbatim).
#   inferred - the paper implies it. Give `page` and `reason` (how you got from the page to the value).
#   assumed  - the paper does not say. Give `reason` only; `page` must be left out.
#   table    - a value read off a table or chart image, which cannot be quoted. Give `page`,
#              `section` (the exhibit name) and `locator` (row and column); `quote` must be null.
#              `reason` is optional, for notes on the reading. check-quotes skips these.
# `section` is optional on any source except table. Page numbers refer to the PDF identified by pdf_sha256.
# Quote strings that could be read as numbers or dates (hashes, YYYY-MM) so YAML keeps them as text.
#
# Scope: the US equity sector strategy (Exhibits 3-4, 1928-2009). The global asset class study
# (Exhibits 8-12, 1973-2009) uses a different universe and is left out, as are the dynamically
# hedged portfolios (Exhibit 7).

paper:
  # Full title exactly as printed on the paper.
  title: "Relative Strength Strategies for Investing"
  # One entry per author, as printed.
  authors: ["Mebane T. Faber"]
  # Year of publication.
  year: 2010
  # Where the paper was obtained (stable link, not a search result).
  url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1585517"
  # The draft date printed on the paper, so a later revision is not mistaken for this one.
  version: "First Draft April 2010"
  # SHA-256 of the exact PDF the page numbers refer to: 64 lowercase hex characters.
  # Compute with: shasum -a 256 papers/<file>.pdf
  pdf_sha256: "9f06e6051e7eb76b5ddf8b8955f96562303b4308bfd7da400a56835a785fb12e"

# How this spec was extracted, by whom, and whether a human has checked it against the paper.
extraction:
  method: "ai-drafted, human-verified"
  drafted_by: "Claude Code (Opus 5.5)"
  verified_by: "Kamil Shirinov"
  date: "2026-11-06"

# The set of securities the strategy chooses from. Cite the page that defines it.
universe:
  value: "Fama-French 10 Industry Portfolios, value-weighted series (US equity sectors)"
  source:
    kind: inferred
    page: 3
    section: "Data"
    reason: >-
      Joins two sentences on page 3: "we are using the 10 Industry Portfolios" and "We utilize
      the value weighted groupings rather than the less realistic equal weighted portfolios".
      No single quote of 25 words covers both.

# Where the paper's price/return data comes from (vendor or database name).
data_source:
  value: "French-Fama CRSP Data Library"
  source:
    kind: stated
    page: 3
    section: "Data"
    quote: "This research report utilizes the French-Fama CRSP Data Library since it has the longest history"

# How often the strategy is observed and traded: monthly, daily, ...
frequency:
  value: "monthly"
  source:
    kind: stated
    page: 7
    quote: "The model is only updated once a month on the last day of the month."

# The ranking variable used to pick securities, in words precise enough to code.
signal:
  value: "Trailing total return including dividends over the lookback window, ranked across the ten sectors"
  source:
    kind: stated
    page: 6
    section: "Ranking"
    quote: "Each month the ten sectors are ranked on trailing total return including dividends."

# How portfolio weights are set: equal weight, value weight, ...
weighting:
  value: "equal weight across the top N sectors (1/N each)"
  source:
    kind: inferred
    page: 6
    section: "Buy Rule"
    reason: >-
      Stated (page 6): the weights for Top 1 (100% in the top sector), Top 2 (50% in each of the
      top two) and Top 3 (33% in each of the top three). Extrapolated: equal weights of 1/N for
      Top 4 to Top 9, which the paper does not describe. Assumed: that weights are reset to 1/N
      at every monthly rebalance. The paper says only that a sector falling out of the top X is
      sold and replaced (Sell Rule); it does not say whether holdings that stay in the top X are
      rebalanced back to equal weight or left to drift.

# When and how the portfolio is rebuilt: monthly, quarterly, overlapping holdings, ...
# NOTE: the value below is only what the quote says. That sectors staying in the top N are reset to
# equal weight each month is NOT stated by the paper; it is assumed, and recorded in `weighting`.
rebalance:
  value: "monthly; a sector that falls out of the top N is sold at the monthly rebalance"
  source:
    kind: stated
    page: 6
    section: "Sell Rule"
    quote: "if a sector falls out of the top X sectors it is sold at the monthly rebalance"

# Transaction costs applied to reported results. If the paper is silent, assume and say so.
costs:
  value: "none (taxes, commissions and slippage excluded)"
  source:
    kind: stated
    page: 7
    quote: "Taxes, commissions, and slippage are excluded"

# The comparison portfolio or index the paper measures against.
benchmark:
  value: "Equal-weighted portfolio of the ten sectors, rebalanced monthly"
  # Page 5 introduces this portfolio "for comparison", alongside the S&P 500. It is the EQ-Weight
  # column of every Exhibit 4 table (pages 8-9). The paper never calls it "the benchmark".
  source:
    kind: stated
    page: 5
    quote: "a portfolio that is equal weighted among the ten sectors, rebalanced monthly"

# First and last month of the paper's sample, as YYYY-MM. Start must be before end.
sample_start:
  value: "1928-01"
  source:
    kind: inferred
    page: 3
    section: "Data"
    reason: >-
      Stated: the year 1928. Page 3 says "Our study begins in 1928 since a year is needed for a
      ranking period", and every exhibit title reads 1928-2009. Assumed: the month. No start month
      is given anywhere, so January 1928 is assumed. (The data start in July 1926, so a 12-month
      ranking would allow a start in mid-1927; the paper says 1928.)

sample_end:
  value: "2009-12"
  source:
    kind: inferred
    page: 3
    section: "Data"
    reason: >-
      Page 3 says the returns run "through December 2009", and every exhibit is titled 1928-2009,
      so the sample is taken to end in December 2009.

# Lookback windows in months: positive, unique, sorted ascending.
# The 1, 3, 6, 9 and 12 month combination (an average of the five trailing returns, page 7;
# Exhibit 4.6) is not a single lookback and cannot be expressed in this format.
lookbacks_months:
  value: [1, 3, 6, 9, 12]
  source:
    kind: inferred
    page: 8
    reason: >-
      Exhibits 4.1 to 4.5 (titles on page 8) report 1, 3, 6, 9 and 12 month relative strength
      portfolios. Page 6 says periods range "from one to twelve months", but only these five are
      reported.

# Number of securities held in the top portfolio: positive, unique, sorted ascending.
top_n:
  value: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  source:
    kind: inferred
    page: 8
    reason: >-
      Every Exhibit 4 table has columns Top1 to Top9 (table images on pages 8-9; the text layer
      has no table content). Page 6: "The system invests in the top X sectors."

# Months between the end of the signal window and the trade (0 = trade at once).
signal_lag_months:
  value: 0
  source:
    kind: stated
    page: 7
    quote: "All entry and exit prices are on the day of the signal at the close."

# What each metric means. Every claim's `metric` must have an entry here.
metrics:
  "CAGR":
    value: "Compound annual growth rate of the portfolio's monthly total returns, in % per year"
    source:
      kind: inferred
      page: 11
      section: "Exhibit 6"
      reason: >-
        The paper never defines CAGR. The exhibit tables have a CAGR row, and Exhibit 6 (page 11)
        is titled "CAGR Outperformance by Decade" with its text saying "on a yearly compounded
        basis", so CAGR is read as the geometric annualised return of the total-return series.
  "volatility":
    value: "Annualised standard deviation of monthly total returns, in % per year"
    source:
      kind: inferred
      page: 8
      section: "Exhibits 3 and 4.1 to 4.5"
      reason: >-
        Inferred from the STDEV row label of the exhibit tables (images). The paper does not say
        how it is computed. Assumed: that it is the standard deviation of monthly returns scaled
        by the square root of 12 (the values, 18% to 23%, are only plausible for an annualised
        figure), and which standard-deviation estimator is used.
  "Sharpe ratio":
    value: "(CAGR - 3.81%) / volatility, with 3.81% per year the T-bill return"
    source:
      kind: inferred
      page: 8
      section: "Exhibits 3 and 4.1 to 4.5"
      reason: >-
        The paper does not define its Sharpe ratio. The 3.81% is a table value: it is printed in
        the row label "SHARPE (3.81%)" of Exhibit 3 (page 5) and Exhibits 4.1 to 4.5 (page 8),
        all images. The label does not say what 3.81% is; it is taken to be the T-bill return
        over 1928-2009. The formula was found by testing, not read from the paper: (CAGR - 3.81) /
        STDEV, rounded to two decimals, matches all 46 printed Sharpe cells (45 in Exhibits 4.1 to
        4.5 and the benchmark in Exhibit 3) except two, C111 and C179, whose differences are within
        rounding of the printed inputs (see their notes).
  "max drawdown":
    value: "Largest peak-to-trough fall of the cumulative total return, in %, stored as a negative number"
    source:
      kind: inferred
      page: 8
      section: "Exhibits 3 and 4.1 to 4.5"
      reason: >-
        Inferred from the MAXDD row label (images); the table prints the figure in parentheses,
        which is stored here as a negative number. Assumed: that the drawdown is measured on
        month-end values of the total-return series, since the paper does not say.
  "best year":
    value: "Highest calendar-year total return, in %"
    source:
      kind: inferred
      page: 9
      section: "Exhibit 4.6"
      reason: >-
        Inferred from the BEST YEAR row label of Exhibit 4.6 (image). Assumed: that a year means
        a calendar year, not a rolling 12 months.
  "worst year":
    value: "Lowest calendar-year total return, in %, stored as a negative number"
    source:
      kind: inferred
      page: 9
      section: "Exhibit 4.6"
      reason: >-
        Inferred from the WORST YEAR row label of Exhibit 4.6 (image); the table prints the figure
        in parentheses. Assumed: that a year means a calendar year, not a rolling 12 months.
  "turnover":
    value: "Turnover of the portfolio as printed in Exhibit 4.6, in %; definition and period unknown"
    source:
      kind: assumed
      reason: >-
        The paper does not define turnover or say over what period it is measured; page 19 says
        only that "turnover of 100% to 400% is very high". Exhibit 4.6 has a Turnover row (image).
        The unit is taken to be percent of portfolio value traded, which is assumed.

# Headline numbers the replication will be checked against. Ids are C1, C2, ...
#
# HEADLINE NOT REPRESENTABLE. The paper's headline (abstract, page 1; repeated on page 9) is
#   "The relative strength portfolios outperform the buy and hold benchmark in approximately 70%
#    of all years", with "300-600 basis points of outperformance per year" (page 9).
# It covers all portfolios at once, so it has no single lookback_months / top_n, and it is
# therefore left out rather than forced onto one combination. Exhibit 4.6 (the 1-3-6-9-12
# combination, page 9) is left out for the same reason.
#
# TABLE NUMBERS. Every exhibit is an image: papers/faber-2010.txt contains the exhibit titles but
# none of the numbers. Each claim below was read from the rendered PDF page, so it cannot carry a
# quote; it has kind `table`, the exhibit name as `section` and the row and column as `locator`.
# A second independent reading by a different model agreed on all 187 values (quaver compare-readings,
# 2026-11-06). What each metric means is defined in `metrics` above; max drawdown, worst year and similar figures are printed in
# parentheses (negative) and stored as negative numbers.
# The EQ-Weight column of each Exhibit 4 table repeats the Exhibit 3 benchmark figures, so it is
# recorded once, as benchmark claims at the end.
